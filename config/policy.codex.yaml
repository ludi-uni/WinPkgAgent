schemaVersion: 1
allowInstall: true
allowUpgrade:
  - patch
  - minor
allowedManagers:
  - scoop
allowedSources:
  - main
  - extras
  - versions
protectedPackages: []
dangerousCategories:
  - driver
  - bios
  - uefi
  - firmware
allowUninstall: false
requireApproval: true
approvalValidityMinutes: 30
rejectStateChanges: true
maxOperations: 20
operationTimeoutSeconds: 600
rebootHandling: record-only
unknownVersionHandling: block
